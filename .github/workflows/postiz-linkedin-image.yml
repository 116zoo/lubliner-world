name: Build Postiz LinkedIn split image

on:
  push:
    branches: [main]
    paths:
      - 'postiz/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        working-directory: postiz
        run: pnpm install --frozen-lockfile

      - name: Build backend and orchestrator
        working-directory: postiz
        run: |
          pnpm --filter ./apps/backend run build
          pnpm --filter ./apps/orchestrator run build

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./postiz
          file: ./postiz/Dockerfile.linkedin-split
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/postiz-linkedin-split:latest
